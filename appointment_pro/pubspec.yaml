
name: appointment_pro
description: "Booking & Business Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  toastification: ^3.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  qr_flutter: ^4.1.0
  intl: ^0.20.2
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  pdf: ^3.13.1
  printing: ^5.15.1
  dio: ^5.11.1
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename: ^1.10.1

package_rename_config:
  android:
    app_name: "Appointment Pro" # Display name
    package_name: "com.rishvi.appointment_pro" # Package name
    override_old_package: "com.example.appointment_pro" # Optional: Cleans up old folder structure
    lang: "kotlin" # Optional: "kotlin" (default) or "java"

  ios:
    app_name: "Appointment Pro" # Display name
    bundle_name: "Appointment Pro" # Bundle name
    package_name: "com.rishvi.appointment_pro" # Product Bundle Identifier

  linux:
    app_name: "Appointment Pro" # Window title
    package_name: "com.rishvi.appointment_pro" # Application ID
    exe_name: "my_app" # Executable name (binary)

  macos:
    app_name: "Appointment Pro" # Product name
    package_name: "com.rishvi.appointment_pro" # Product Bundle Identifier
    copyright_notice: "Copyright © 2026" # Copyright notice

  web:
    app_name: "Appointment Pro" # App title & PWA name
    short_app_name: "App" # PWA short name (defaults to app_name)
    description: "Best App" # Web app description

  windows:
    app_name: "Appointment Pro" # Window title & Software name
    organization: "Rishvi" # Organization/Company name
    copyright_notice: "Copyright © 2026" # Legal copyright
    exe_name: "my_app" # Executable name (binary)


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/App_Icons/AppointmentPro_Dark.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"

flutter:
  uses-material-design: true
  assets:
    - assets/App_Icons/

