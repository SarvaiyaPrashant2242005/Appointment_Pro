
name: appointment_pro
description: "Booking & Business Manager"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  toastification: ^3.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/App_Icons/AppointmentPro_Dark.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/App_Icons/AppointmentPro_Dark.png"

flutter:
  uses-material-design: true
  assets:
    - assets/App_Icons/

