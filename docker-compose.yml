services:
  postgres:
    image: postgres:16-alpine
    container_name: appointment-pro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-appointment_pro}
      POSTGRES_USER: ${DB_USER:-appointment_pro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: appointment-pro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appointment_pro}
      DB_USER: ${DB_USER:-appointment_pro}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_LOGGING: "false"
      UPLOAD_DIR: uploads
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    volumes:
      - uploads_data:/app/Server/uploads

  # One-off: creates the tables on a fresh database (the app only syncs the schema when
  # NODE_ENV=development). Run once:  docker compose --profile init run --rm db-init
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["init"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-appointment_pro}
      DB_USER: ${DB_USER:-appointment_pro}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    command: ["node", "-e", "require('./app'); require('./config/database').connectDatabase().then(() => process.exit(0))"]

volumes:
  postgres_data:
  uploads_data:
